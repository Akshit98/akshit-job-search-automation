name: Job search

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "job_search/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/job-search.yml"
  push:
    branches: [main]
    paths:
      - "job_search/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/job-search.yml"
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: job-search-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Find new jobs
        id: search
        if: github.event_name != 'pull_request'
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
        run: python -m job_search run
      - name: Add report to workflow summary
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
        run: |
          if [ "$SEARCH_OUTCOME" = "success" ] && [ -f output/latest.md ]; then
            cat output/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Job search failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The previous good report was preserved. Inspect the source errors in the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify Slack when configured
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m job_search.notify
      - name: Commit reports
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data/seen_jobs.json
          git diff --cached --quiet || git commit -m "chore: update job matches"
          git pull --rebase origin main
          git push
